name: Build for dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Docker Image
    runs-on: local_server

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"

      - name: Install dependencies
        run: |
          git config --global url."https://${{ secrets.USER }}:${{ secrets.PAT }}@gitea.tagsamurai.local/".insteadOf "https://gitea.tagsamurai.local/"
          go env -w GOPRIVATE=gitea.tagsamurai.local/*
          GOWORK=off go mod tidy
          GOWORK=off go mod tidy -diff
          GOWORK=off go build ./...

      - name: Vulnerabilities Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests with coverage
        id: test
        run: |
          GOWORK=off go test ./... -coverprofile=coverage.txt -covermode=set

          coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage is $coverage%"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

      - name: Check coverage threshold
        run: |
          MIN_COVERAGE=0.0
          coverage=${{ steps.test.outputs.coverage }}
          if (( $(echo "$coverage < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage ($coverage%) is below the threshold of $MIN_COVERAGE%"
            exit 1
          else
            echo "Coverage ($coverage%) meets the threshold of $MIN_COVERAGE%"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ts-asset-transaction:development
          outputs: type=docker,dest=/tmp/ts-asset-transaction.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          network: host
          build-args: |
            USER=${{ secrets.USER }}
            PAT=${{ secrets.PAT }}

  deploy:
    name: Deploy Docker Image
    needs: build
    runs-on: local_server
    steps:
      - name: Upload to dev server
        uses: garygrossgarten/github-action-scp@release
        with:
          local: /tmp/ts-asset-transaction.tar
          remote: /tmp/ts-asset-transaction.tar
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Clean up tmp file
        run: rm -f /tmp/ts-asset-transaction.tar

      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            docker stop ts-asset-transaction || true
            docker rm ts-asset-transaction || true
            docker rmi ts-asset-transaction:development || true
            docker load -i /tmp/ts-asset-transaction.tar
            rm /tmp/ts-asset-transaction.tar
            docker run -d --restart=always \
              --name ts-asset-transaction \
              -v ${{ secrets.FOLDER }}/.env:/tagsamurai/api/asset-transaction/.env \
              --network microservices_network \
              ts-asset-transaction:development
